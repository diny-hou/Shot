<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar glass" aria-label="Title bar">
        <div class="titlebar-brand" data-tauri-drag-region aria-hidden="true"></div>

        <div class="titlebar-controls">
          <div
            class="menu-select glass-inset"
            id="monitor-menu"
            data-tooltip="Capture display"
          >
            <button
              type="button"
              class="menu-select-btn"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-label="Capture display"
            >
              <span class="menu-select-label">Display 1</span>
              <span class="menu-select-caret" aria-hidden="true"></span>
            </button>
            <div class="menu-select-panel glass" id="monitor-panel" hidden role="listbox"></div>
            <input type="hidden" id="capture-monitor" value="primary" />
          </div>

          <div class="tool-group glass-inset">
            <button id="pick-dir-btn" class="tool tool-sm" type="button" data-tooltip="Change save folder (click to choose, right-click to open)" aria-label="Save folder"></button>
            <button id="name-btn" class="tool tool-sm" type="button" data-tooltip="File name (prefix and suffix)" aria-label="File name" aria-haspopup="true"></button>
            <button id="clear-stock-btn" class="tool tool-sm" type="button" data-tooltip="Clear stock" aria-label="Clear stock"></button>
            <button id="prefs-btn" class="tool tool-sm" type="button" data-tooltip="Preferences" aria-label="Preferences"></button>
          </div>
        </div>

        <div class="titlebar-drag" data-tauri-drag-region></div>

        <div class="titlebar-actions">
          <button
            id="taskbar-btn"
            class="tool tool-sm glass-inset"
            type="button"
            data-tooltip="Exclude taskbar"
            aria-label="Exclude taskbar"
            aria-pressed="true"
          ></button>
          <button
            id="pin-btn"
            class="tool tool-sm glass-inset"
            type="button"
            data-tooltip="Always on top"
            aria-label="Always on top"
            aria-pressed="false"
          ></button>
          <button id="minimize-btn" class="tool tool-sm win-btn" type="button" data-tooltip="Minimize" aria-label="Minimize"></button>
          <button id="close-btn" class="tool tool-sm win-btn win-btn-close" type="button" data-tooltip="Close" aria-label="Close"></button>
        </div>
      </header>

      <main class="stage">
        <div class="capture-row">
          <div class="capture-options">
            <div
              class="menu-select glass-inset"
              id="extension-menu"
              data-tooltip="File format"
            >
              <button
                type="button"
                class="menu-select-btn"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-label="File format"
              >
                <span class="menu-select-label">PNG</span>
                <span class="menu-select-caret" aria-hidden="true"></span>
              </button>
              <div class="menu-select-panel glass" hidden role="listbox">
                <button type="button" class="menu-select-option" data-value="png" data-label="PNG" role="option">PNG</button>
                <button type="button" class="menu-select-option" data-value="jpeg" data-label="JPEG" role="option">JPEG</button>
                <button type="button" class="menu-select-option" data-value="webp" data-label="WebP" role="option">WebP</button>
              </div>
              <input type="hidden" id="extension-select" value="png" />
            </div>

            <div
              class="menu-select glass-inset"
              id="preset-menu"
              data-tooltip="Preset (frame / fullscreen capture)"
            >
              <button
                type="button"
                class="menu-select-btn"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-label="Capture preset"
              >
                <span class="menu-select-label">1920×1080</span>
                <span class="menu-select-caret" aria-hidden="true"></span>
              </button>
              <div class="menu-select-panel glass" id="preset-panel" hidden role="listbox"></div>
              <input type="hidden" id="resolution-preset" value="ratio16x9" />
            </div>

            <div
              class="menu-select glass-inset"
              id="export-scale-menu"
              data-tooltip="Copy / drag export size"
            >
              <button
                type="button"
                class="menu-select-btn"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-label="Export scale"
              >
                <span class="menu-select-label">100%</span>
                <span class="menu-select-caret" aria-hidden="true"></span>
              </button>
              <div class="menu-select-panel glass" id="export-scale-panel" hidden role="listbox"></div>
              <input type="hidden" id="export-scale-preset" value="1" />
            </div>
          </div>

          <div class="capture-actions">
            <button id="capture-region-btn" class="tool tool-side" type="button" data-tooltip="Select region" aria-label="Select region"></button>
            <button
              id="capture-full-btn"
              class="tool tool-capture"
              type="button"
              data-tooltip="Screenshot"
              aria-label="Screenshot"
            ></button>
            <button
              id="frame-mode-btn"
              class="tool tool-side"
              type="button"
              data-tooltip="Frame capture"
              aria-label="Frame capture"
              aria-pressed="false"
            ></button>
          </div>
        </div>

        <section class="stock-strip glass" aria-label="Stock" data-tooltip="Middle-drag to scroll horizontally">
          <div id="stock-list" class="stock-list"></div>
        </section>
      </main>

      <div id="name-popover" class="popover glass" hidden>
        <label class="mini-field wide">
          <span>Prefix</span>
          <input id="prefix-input" class="mini-input mono glass-input" type="text" value="shot_" />
        </label>
        <label class="mini-field wide">
          <span>Suffix</span>
          <input id="suffix-input" class="mini-input mono glass-input" type="text" value="" />
        </label>
        <p class="prefs-subtitle">Save folder</p>
        <p id="save-dir" class="save-dir mono" title=""></p>
        <div class="popup-actions save-dir-actions">
          <button id="save-dir-change-btn" class="popover-action" type="button">Change…</button>
          <button id="save-dir-open-btn" class="popover-action popover-action-ghost" type="button">Open</button>
        </div>
      </div>

      <div id="export-scale-popover" class="popover glass" hidden>
        <label class="mini-field wide">
          <span>Label</span>
          <input id="export-scale-label" class="mini-input mono glass-input" type="text" placeholder="150%" />
        </label>
        <label class="mini-field wide">
          <span>Scale</span>
          <input
            id="export-scale-value"
            class="mini-input mono glass-input"
            type="number"
            min="0.05"
            max="8"
            step="0.05"
            value="1.5"
            placeholder="1 = 100%, 0.5 = 50%, 2 = 200%"
          />
        </label>
        <div class="popup-actions">
          <button id="export-scale-cancel-btn" class="popover-action popover-action-ghost" type="button">Cancel</button>
          <button id="export-scale-add-btn" class="popover-action" type="button">Add</button>
        </div>
      </div>

      <p id="status" class="status glass-chip" role="status"></p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
