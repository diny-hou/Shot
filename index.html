<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="titlebar glass" aria-label="Title bar">
        <div class="titlebar-brand" data-tauri-drag-region aria-hidden="true"></div>

        <div class="titlebar-controls">
          <div class="tool-group glass-inset">
            <button id="pick-dir-btn" class="tool tool-sm" type="button" data-tooltip="保存フォルダを開く（右クリックで変更／右ドラッグで移動）" aria-label="保存フォルダ"></button>
            <button id="name-btn" class="tool tool-sm" type="button" data-tooltip="ファイル名（接頭辞・接尾辞）" aria-label="ファイル名" aria-haspopup="true"></button>
            <button id="clear-stock-btn" class="tool tool-sm" type="button" data-tooltip="ストックをクリア" aria-label="ストックをクリア"></button>
            <button id="prefs-btn" class="tool tool-sm" type="button" data-tooltip="Preferences" aria-label="Preferences"></button>
          </div>
        </div>

        <div class="titlebar-drag" data-tauri-drag-region></div>

        <div class="titlebar-actions">
          <button
            id="taskbar-btn"
            class="tool tool-sm glass-inset"
            type="button"
            data-tooltip="タスクバーを除外"
            aria-label="タスクバーを除外"
            aria-pressed="true"
          ></button>
          <button
            id="pin-btn"
            class="tool tool-sm glass-inset"
            type="button"
            data-tooltip="常に最前面"
            aria-label="常に最前面"
            aria-pressed="false"
          ></button>
          <button id="minimize-btn" class="tool tool-sm win-btn" type="button" data-tooltip="最小化" aria-label="最小化"></button>
          <button id="close-btn" class="tool tool-sm win-btn win-btn-close" type="button" data-tooltip="閉じる" aria-label="閉じる"></button>
        </div>
      </header>

      <main class="stage">
        <div class="options-row">
          <div
            class="menu-select glass-inset"
            id="extension-menu"
            data-tooltip="保存形式"
          >
            <button
              type="button"
              class="menu-select-btn"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-label="保存形式"
            >
              <span class="menu-select-label">PNG</span>
              <span class="menu-select-caret" aria-hidden="true"></span>
            </button>
            <div class="menu-select-panel glass" hidden role="listbox">
              <button type="button" class="menu-select-option" data-value="png" data-label="PNG" role="option">PNG</button>
              <button type="button" class="menu-select-option" data-value="jpeg" data-label="JPEG" role="option">JPEG</button>
              <button type="button" class="menu-select-option" data-value="webp" data-label="WebP" role="option">WebP</button>
            </div>
            <input type="hidden" id="extension-select" value="png" />
          </div>

          <div
            class="menu-select glass-inset"
            id="preset-menu"
            data-tooltip="プリセット（枠／全画面キャプチャ）"
          >
            <button
              type="button"
              class="menu-select-btn"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-label="枠のプリセット"
            >
              <span class="menu-select-label">1920×1080</span>
              <span class="menu-select-caret" aria-hidden="true"></span>
            </button>
            <div class="menu-select-panel glass" id="preset-panel" hidden role="listbox"></div>
            <input type="hidden" id="resolution-preset" value="ratio16x9" />
          </div>

          <div
            class="menu-select glass-inset"
            id="monitor-menu"
            data-tooltip="キャプチャ対象ディスプレイ"
          >
            <button
              type="button"
              class="menu-select-btn"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-label="キャプチャ対象ディスプレイ"
            >
              <span class="menu-select-label">ディスプレイ1</span>
              <span class="menu-select-caret" aria-hidden="true"></span>
            </button>
            <div class="menu-select-panel glass" id="monitor-panel" hidden role="listbox"></div>
            <input type="hidden" id="capture-monitor" value="primary" />
          </div>
        </div>

        <div class="capture-row">
          <button id="capture-region-btn" class="tool tool-side" type="button" data-tooltip="範囲選択" aria-label="範囲選択"></button>
          <button
            id="capture-full-btn"
            class="tool tool-capture"
            type="button"
            data-tooltip="スクリーンショット"
            aria-label="スクリーンショット"
          ></button>
          <button
            id="frame-mode-btn"
            class="tool tool-side"
            type="button"
            data-tooltip="ウィンドウキャプチャ（枠）"
            aria-label="ウィンドウキャプチャ"
            aria-pressed="false"
          ></button>
        </div>

        <section class="stock-strip glass" aria-label="Stock" data-tooltip="ミドルドラッグで横スクロール">
          <div id="stock-list" class="stock-list"></div>
        </section>
      </main>

      <div id="name-popover" class="popover glass" hidden>
        <label class="mini-field wide">
          <span>Prefix</span>
          <input id="prefix-input" class="mini-input mono glass-input" type="text" value="shot_" />
        </label>
        <label class="mini-field wide">
          <span>Suffix</span>
          <input id="suffix-input" class="mini-input mono glass-input" type="text" value="" />
        </label>
        <p id="save-dir" class="save-dir mono" title=""></p>
      </div>

      <p id="status" class="status glass-chip" role="status"></p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
